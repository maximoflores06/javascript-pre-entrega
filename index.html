<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/styles.css">
    <title>Botines ITZ</title> 
    <script src="./js/main.js" defer></script>
</head>
    <body>
      <header>
        <h1 id="titulo">Botines ITZ</h1>
      <nav>
        <ul>
          <li><a href="#" class="link">Inicio</a></li>
        </ul>
      </nav>
    </header>
    <main class="contenedor">
        <h1>Algunos de nuestros modelos</h1>
        <p>
            Ingrese el modelo de botin que este buscando
        </p>
        <form id="formularioBotines">
            <label for="idBotines">
                Inserte aqui marca y modelo
            </label>
            <input
                type="text"
                id="idBotines"
                min="1"
                placeholder= "Ej : Adidas predator"
                required
            >
            <button type="submit">
                Buscar 
            </button>
        </form>
        <section id="resultado"></section>
        <section id="catalogo"></section>
        <div id="imagen"></div>
    </main>

 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>

</html>
